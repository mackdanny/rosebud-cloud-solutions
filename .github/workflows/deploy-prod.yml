name: Promote to Production (Azure Static Web App)

# Manual promotion only. Nothing here runs on push.
# Flow: you dispatch this workflow -> the `gate` job pauses for your approval
# (production environment, required reviewer) -> the `deploy` job builds the
# current ref and deploys it to the PROD Static Web App.
#
# The deploy job runs under `environment: dev` on purpose: that is the identity
# the existing Azure federated credential trusts, so no Entra change is needed.
# Authorisation to touch the prod resource comes from the service principal's
# role in the resource group, not from the environment name.
#
# This workflow does NOT touch the live www binding. www stays on the dev app
# until the deliberate cutover (see docs/deploy-pipeline.md).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm deploying the current main to production'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

env:
  TENANT_ID: 902841c1-b9f1-4253-91e5-f868aac15774
  SUBSCRIPTION_ID: 495bf684-02f0-4d46-8b31-c82b31aa7943
  RESOURCE_GROUP: rg-uks-web-001
  SWA_NAME: swa-uks-web-prod-001
  SWA_LOCATION: westeurope
  SWA_SKU: Free
  PROD_TEST_DOMAIN: prod.rosebudcloudsolutions.co.uk

jobs:
  # Approval gate. Does no work; its only job is to hold the run until an
  # authorised reviewer approves the `production` environment.
  gate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "promote" ]; then
            echo "Confirmation text was not 'promote' — aborting."
            exit 1
          fi
          echo "Promotion of ${{ github.sha }} approved."

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    # Reuse the dev environment identity so the existing federated credential
    # authenticates the Azure login. RBAC on the resource group authorises prod.
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_CHATBOT_API_URL: https://rcs-chatbot.rosebudcloudsolutions.workers.dev

      - name: Validate build output
        run: |
          test -d dist/client            || { echo "FAIL: dist/client/ not found";        exit 1; }
          test -f dist/client/index.html || { echo "FAIL: dist/client/index.html missing"; exit 1; }
          echo "PASS: build output present"
          find dist/client -name "*.html" | sort

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SP_WEB_DEV_CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Ensure prod Static Web App exists
        run: |
          az staticwebapp show \
            --name ${{ env.SWA_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --output none 2>/dev/null && echo "Prod SWA already exists." || {
              echo "Creating prod SWA..."
              az staticwebapp create \
                --name ${{ env.SWA_NAME }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --location ${{ env.SWA_LOCATION }} \
                --sku ${{ env.SWA_SKU }}
            }

      - name: Get SWA deployment token
        id: get-token
        run: |
          token=$(az staticwebapp secrets list \
            --name ${{ env.SWA_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> $GITHUB_OUTPUT

      - name: Deploy to prod Static Web App
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-token.outputs.token }}
          action: upload
          app_location: dist/client
          skip_app_build: true
          skip_api_build: true

      - name: Report prod hostname
        run: |
          host=$(az staticwebapp show \
            --name ${{ env.SWA_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "defaultHostname" --output tsv)
          echo "Prod app is live at: https://$host"
          echo "To attach the test domain, add a Cloudflare CNAME: ${{ env.PROD_TEST_DOMAIN }} -> $host"

      # Non-fatal: only succeeds once the CNAME above exists. www is NOT bound here.
      - name: Bind test domain (optional, non-fatal)
        continue-on-error: true
        run: |
          existing=$(az staticwebapp hostname list \
            --name ${{ env.SWA_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?name=='${{ env.PROD_TEST_DOMAIN }}'].name" --output tsv)
          if [ -z "$existing" ]; then
            az staticwebapp hostname set \
              --name ${{ env.SWA_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --hostname "${{ env.PROD_TEST_DOMAIN }}" \
            || echo "Test-domain bind skipped (add the Cloudflare CNAME, then re-run)."
          else
            echo "Test domain already bound."
          fi

      - name: Azure logout
        if: always()
        run: az logout
