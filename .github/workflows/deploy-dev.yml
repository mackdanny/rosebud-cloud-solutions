name: Deploy to Azure Static Web App (Dev)

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'claude/**'
  workflow_dispatch:

env:
  TENANT_ID: 902841c1-b9f1-4253-91e5-f868aac15774
  SUBSCRIPTION_ID: 495bf684-02f0-4d46-8b31-c82b31aa7943

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SP_WEB_DEV_CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Get SWA deployment token
        id: get-token
        run: |
          token=$(az staticwebapp secrets list \
            --name ${{ vars.SWA_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Static Web App
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-token.outputs.token }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true

      - name: Azure logout
        if: always()
        run: az logout
