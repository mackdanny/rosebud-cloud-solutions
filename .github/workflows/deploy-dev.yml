name: Deploy to Azure Static Web App (Dev)

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'claude/**'
  workflow_dispatch:

env:
  TENANT_ID: 902841c1-b9f1-4253-91e5-f868aac15774
  SUBSCRIPTION_ID: 495bf684-02f0-4d46-8b31-c82b31aa7943
  RESOURCE_GROUP: rg-uks-web-001
  SWA_NAME: swa-uks-web-dev-001
  SWA_LOCATION: westeurope
  SWA_SKU: Free
  CUSTOM_DOMAIN: dev.rosebudcloudsolutions.co.uk

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_CHATBOT_API_URL: https://rcs-chatbot.rosebudcloudsolutions.workers.dev
          # Dev-site sign-in goes to the DEV platform. Unset (the prod build)
          # falls back to the live portal, so only dev builds ever divert.
          VITE_PORTAL_URL: https://ca-rcs-journey-dev.bluestone-629b4555.uksouth.azurecontainerapps.io

      - name: Validate build output
        run: |
          echo "=== Build output structure ==="
          find dist -maxdepth 3 -type f | sort

          echo ""
          echo "=== Checking required files ==="
          test -d dist/client          || { echo "FAIL: dist/client/ not found";       exit 1; }
          test -f dist/client/index.html || { echo "FAIL: dist/client/index.html not found"; exit 1; }
          echo "PASS: dist/client/index.html exists"

          echo ""
          echo "=== HTML pages found ==="
          find dist/client -name "*.html" | sort

          echo ""
          echo "=== Asset summary ==="
          find dist/client/assets -type f | wc -l | xargs -I{} echo "{} asset files"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SP_WEB_DEV_CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Ensure Static Web App exists
        run: |
          az staticwebapp show \
            --name ${{ env.SWA_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --output none 2>/dev/null || \
          az staticwebapp create \
            --name ${{ env.SWA_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.SWA_LOCATION }} \
            --sku ${{ env.SWA_SKU }}

      - name: Get SWA deployment token
        id: get-token
        run: |
          token=$(az staticwebapp secrets list \
            --name ${{ env.SWA_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Static Web App
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-token.outputs.token }}
          action: upload
          app_location: dist/client
          skip_app_build: true
          skip_api_build: true

      - name: Bind custom domains
        # www lives on the prod app now (swa-uks-web-prod-001). Dev must only
        # ever bind dev.* so a dev deploy can never reclaim the live domain.
        run: |
          for domain in dev.rosebudcloudsolutions.co.uk; do
            existing=$(az staticwebapp hostname list \
              --name ${{ env.SWA_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "[?name=='$domain'].name" \
              --output tsv)
            if [ -z "$existing" ]; then
              echo "Binding $domain..."
              az staticwebapp hostname set \
                --name ${{ env.SWA_NAME }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --hostname "$domain"
            else
              echo "Custom domain $domain already bound, skipping."
            fi
          done

      # Cloudflare cache purge lives in the prod workflow now: dev.* is not
      # proxied through Cloudflare, so a dev deploy must not purge the live
      # (www) edge cache.

      - name: Azure logout
        if: always()
        run: az logout
