name: Deploy to Azure Static Web App (Dev)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TENANT_ID: 902841c1-b9f1-4253-91e5-f868aac15774
  SUBSCRIPTION_ID: 495bf684-02f0-4d46-8b31-c82b31aa7943

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SP_WEB_DEV_CLIENT_ID }}
          client-secret: ${{ secrets.SP_WEB_DEV_SECRET }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Deploy to Azure Static Web App
        run: |
          az staticwebapp deploy \
            --name ${{ vars.SWA_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --source ./dist \
            --no-build

      - name: Azure logout
        if: always()
        run: az logout
